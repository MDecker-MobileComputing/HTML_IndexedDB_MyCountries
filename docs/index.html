<!DOCTYPE html>
<html lang="de">
<head>
    <title>Alle meine Länder</title>
    <meta charset="utf-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="laender-styles.css">
</head>
<body>

  <h1>Alle meine Länder</h1>

  <p>
    Es zählen nur Länder, in denen man mindestens einmal übernachtet hat.
    Bei mehreren Besuchen ist das Jahr des ersten Besuchs zu nennen.
  </p>
  <br>

  <h2>Neues Land erfassen</h2>
  <form id="anmeldeFormular">

    <div>
      <label for="inputJahr">Jahr:</label>
      <input id="inputJahr"
             type="number"  
             name="jahr" 
             required 
             min="1900" 
             max="2099" 
             inputmode="numeric" 
             pattern="\d{4}" 
             title="Vierstellige Jahreszahl">
    </div><br>

    <div>
      <label for="inputLand">Land:</label>
      <input type="text" id="inputLand" required>
    </div><br>

    <button id="buttonSpeichern"     type="submit" >Speichern</button>
    <button id="buttonZuruecksetzen" type="reset"  >Zurücksetzen</button>

  </form>


  <hr><!-- ----------------------------------------------- -->


  <h2>Liste der von mir bereits besuchten Länder</h2>

  <table>
    <thead>
      <tr>
        <th>Jahr</th>
        <th>Land</th>
        <th></th><!-- Löschen           -->
        <th></th><!-- Jahreszahl ändern -->
        <th></th><!-- Land ändern       -->
      </tr>
    </thead>
    <tbody id="tabelleBody">
    </tbody>
  </table>
  <br>

  <p>Anzahl Länder: <span id="spanAnzahlLaender"></span></p>

  <script src="datenbank.js"></script>
  <script src="laender.js"    ></script>

</body>
</html>
