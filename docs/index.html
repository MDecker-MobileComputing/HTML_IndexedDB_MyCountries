<!DOCTYPE html>
<html lang="en">
<head>
  <title>All My Countries</title>
  <meta charset="utf-8" >
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="countries-styles.css">
  <script src="database.js"  defer></script>
  <script src="countries.js" defer></script>
</head>
<body>

  <h1>All My Countries</h1>

  <p>
    Count only countries where you have stayed overnight at least once.
    If you have visited more than once, enter the year of your first visit.
  </p>
  <br>

  <h2>Add a country</h2>
  <form id="entryForm">

    <div>
      <label for="yearInput">Year:</label>
      <input id="yearInput"
             type="number"
             name="year"
             required
             min="1900"
             max="2099"
             inputmode="numeric"
             pattern="\d{4}"
             title="Enter a four-digit year">
    </div><br>

    <div>
      <label for="countryInput">Country:</label>
      <input type="text" id="countryInput" required>
    </div><br>

    <button id="saveButton"  type="submit">Save</button>
    <button id="resetButton" type="reset">Reset</button>

  </form>


  <hr><!-- ----------------------------------------------- -->


  <h2>Countries I have visited</h2>

  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Country</th>
        <th></th><!-- Delete       -->
        <th></th><!-- Edit year    -->
        <th></th><!-- Edit country -->
      </tr>
    </thead>
    <tbody id="tableBody">
    </tbody>
  </table>
  <br>

  <p>Number of countries: <span id="countryCount"></span></p>

</body>
</html>
